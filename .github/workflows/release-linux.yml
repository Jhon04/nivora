name: Build and release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: deb
            artifact_name: linux-deb
          - os: windows-2022
            bundle: nsis
            artifact_name: windows-nsis

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build -- --bundles ${{ matrix.bundle }}

      - name: Locate build artifact
        id: package
        shell: bash
        run: |
          set -e
          mkdir -p release-assets
          if [ "${{ matrix.bundle }}" = "deb" ]; then
            artifact=$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -n 1)
            if [ -z "$artifact" ]; then
              echo "No .deb package was generated."
              find src-tauri/target/release -type f | sort | head -200
              exit 1
            fi
            cp "$artifact" "release-assets/nivora_${GITHUB_REF_NAME#v}.deb"
          else
            artifact=$(find src-tauri/target/release/bundle/nsis -type f \( -name '*.exe' -o -name '*.msi' \) | head -n 1)
            if [ -z "$artifact" ]; then
              echo "No Windows installer was generated."
              find src-tauri/target/release -type f | sort | head -200
              exit 1
            fi
            cp "$artifact" "release-assets/nivora_${GITHUB_REF_NAME#v}.exe"
          fi
          ls -la release-assets

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
