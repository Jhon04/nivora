name: Build and release Linux app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Locate Debian package
        id: package
        run: |
          set -e
          deb_file=$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -n 1)
          if [ -z "$deb_file" ]; then
            echo "No .deb package was generated."
            find src-tauri/target/release -type f | sort | head -200
            exit 1
          fi
          mkdir -p release-assets
          cp "$deb_file" "release-assets/nivora_${GITHUB_REF_NAME#v}.deb"
          echo "deb_path=release-assets/nivora_${GITHUB_REF_NAME#v}.deb" >> "$GITHUB_OUTPUT"
          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.deb
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
