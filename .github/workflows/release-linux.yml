name: Build and release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb y appimage salen del mismo compilado: separarlos en dos jobs
          # costaria compilar Rust dos veces (~9 min) para nada.
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact_name: linux
          - os: windows-2022
            bundles: nsis
            artifact_name: windows-nsis

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install NSIS for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install nsis -y

      - name: Install frontend dependencies
        run: npm ci

      # El tag manda: así el instalador nunca sale con una versión distinta a
      # la del release que lo publica.
      - name: Sync version with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/sync-version.mjs "${{ github.ref_name }}"

      # Sin estas dos variables el bundler no firma, y una app instalada
      # rechazará la actualización por firma inválida.
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      # Que exista el instalador no basta: sin el .sig al lado, el release se
      # publicaría y las apps instaladas no podrían actualizarse.
      - name: Verify installers and signatures
        shell: bash
        run: |
          set -e
          bundle=src-tauri/target/release/bundle
          if [ "${{ runner.os }}" = "Linux" ]; then
            ls "$bundle"/deb/*.deb
            ls "$bundle"/appimage/*.AppImage
            ls "$bundle"/appimage/*.AppImage.sig
          else
            ls "$bundle"/nsis/*.exe
            ls "$bundle"/nsis/*.exe.sig
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/appimage/**/*.AppImage
            src-tauri/target/release/bundle/appimage/**/*.AppImage.sig
            src-tauri/target/release/bundle/nsis/**/*.exe
            src-tauri/target/release/bundle/nsis/**/*.exe.sig
          if-no-files-found: error

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest

    steps:
      # Hace falta el repo para poder ejecutar scripts/generar-latest-json.mjs.
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f | sort

      # latest.json es lo que consultan las apps ya instaladas para saber si hay
      # version nueva. Se genera aqui porque necesita las firmas de AMBAS
      # plataformas, que hasta este job no estan juntas en ningun sitio.
      - name: Generate updater manifest
        run: |
          node scripts/generar-latest-json.mjs \
            --version "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --assets release-assets \
            --out release-assets/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.exe
            release-assets/latest.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
