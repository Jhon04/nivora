name: Build and release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: deb
            artifact_name: linux-deb
          - os: windows-2022
            bundle: nsis
            artifact_name: windows-nsis

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install NSIS for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install nsis -y

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        shell: bash
        run: npm run tauri:build -- --bundles ${{ matrix.bundle }}

      - name: Verify installer was generated
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.bundle }}" = "deb" ]; then
            find src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -n 5
          else
            find src-tauri/target/release/bundle/nsis -type f \( -name '*.exe' -o -name '*.msi' \) | head -n 5
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/nsis/**/*.exe
            src-tauri/target/release/bundle/nsis/**/*.msi
          if-no-files-found: error

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: |
          find release-assets -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.deb
            release-assets/**/*.exe
            release-assets/**/*.msi
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
